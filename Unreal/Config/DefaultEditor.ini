; Editor-only memory tuning. DefaultEditor.ini is not loaded by packaged builds,
; so nothing here changes shipped game quality. Targets 16-32 GB dev machines.

[SystemSettings]
; Cap the texture streaming pool (MB) in the editor; the default scales with VRAM.
r.Streaming.PoolSize=2000
r.Streaming.LimitPoolSizeToVRAM=1
; Fewer parallel shader compile workers means less RAM during shader builds.
r.ShaderCompiler.MaxWorkerCount=4
; Cheaper Lumen reflections while editing.
r.Lumen.Reflections.DownsampleFactor=2
